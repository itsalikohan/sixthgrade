<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی مرتب کردن کلمات</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-frame {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background: radial-gradient(circle, #ffeb3b, #fbc02d);
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 8px solid #333;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: radial-gradient(circle, #ffeb3b, #fbc02d);
            animation: fadeIn 0.4s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #d32f2f;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 5px rgba(255,255,255,0.8);
        }

        .btn {
            background: linear-gradient(45deg, #f12711, #f5af19);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            margin: 6px;
            width: 80%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.3);
        }

        .account-btn { background: linear-gradient(45deg, #8e2de2, #4a00e0); }
        .settings-btn { background: linear-gradient(45deg, #00c6ff, #0072ff); }
        .exit-btn { background: linear-gradient(45deg, #cb2d3e, #ef473a); }

        .account-box, .settings-box, .quiz-box {
            background: white;
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            color: #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: right;
        }

        .account-box label {
            font-size: 0.95rem;
            font-weight: bold;
            color: #d32f2f;
        }

        .account-box input, .account-box select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Vazirmatn', sans-serif;
            outline: none;
        }

        .profile-card {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #2196F3;
            text-align: center;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            font-weight: bold;
        }

        .danger-action-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(24px); }

        .subjects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }

        .subject-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #ff9800;
            color: #d32f2f;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .subject-btn:hover { background: white; transform: scale(1.05); }

        .stages-container { width: 100%; margin-bottom: 10px; }
        
        .stages-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 350px;
            margin: 0 auto 15px auto;
            direction: rtl;
        }

        .stage-card {
            background: #4caf50;
            border: 3px solid #fff;
            border-radius: 18px;
            padding: 15px 5px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        .stage-card:hover { transform: scale(1.03); }
        
        .stage-card.locked {
            background: #9e9e9e;
            border: 3px dashed #e0e0e0;
            cursor: not-allowed;
        }
        
        .stars {
            font-size: 0.75rem;
            color: #ffeb3b;
            margin-top: 4px;
            min-height: 15px;
            letter-spacing: 1px;
        }

        .pagination-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
            padding: 0 5px;
        }

        .page-nav-btn {
            background: #ffa726; 
            color: white; 
            border: none; 
            padding: 10px 22px;
            border-radius: 30px; 
            font-weight: bold; 
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .page-nav-btn:disabled { background: #bdbdbd; cursor: not-allowed; box-shadow: none; }
        
        .page-indicator {
            font-weight: 900;
            color: #3b2c00;
            font-size: 1.1rem;
        }

        .back-icon-btn {
            position: absolute; bottom: 20px; left: 20px; background: #f44336;
            color: white; border: none; width: 45px; height: 45px; border-radius: 50%;
            font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .quiz-box h3 { margin-bottom: 12px; color: #388e3c; font-size: 1rem; line-height: 1.5; }
        
        .scrambled-word {
            font-size: 1.8rem;
            font-weight: 900;
            color: #d32f2f;
            background: #ffe082;
            padding: 10px;
            border-radius: 12px;
            letter-spacing: 4px;
            margin-bottom: 15px;
            border: 2px dashed #f57c00;
        }

        .quiz-box input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #4caf50;
            border-radius: 12px;
            font-size: 1.2rem;
            font-family: 'Vazirmatn', sans-serif;
            text-align: center;
            outline: none;
            margin-bottom: 10px;
        }

        .submit-word-btn {
            background: linear-gradient(45deg, #4caf50, #8bc34a);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .submit-word-btn:hover { background: linear-gradient(45deg, #388e3c, #7cb342); }
    </style>
</head>
<body>

    <div class="phone-frame">
        
        <!-- صفحه اول -->
        <div id="screen-home" class="screen active">
            <h1>🧩 کلمات به‌هم‌ریخته</h1>
            <div id="welcome-msg" style="font-weight: bold; color: #333; margin-bottom: 10px; font-size: 1.1rem;"></div>
            <button class="btn" onclick="playSound(); goToScreen('screen-subjects')">شروع بازی 🔔</button>
            <button class="btn account-btn" onclick="playSound(); goToScreen('screen-account')">اکانت 👤</button>
            <button class="btn settings-btn" onclick="playSound(); goToScreen('screen-settings')">تنظیمات ⚙️</button>
            <button class="btn exit-btn" onclick="playSound(); exitGame()">خروج 🚪</button>
        </div>

        <!-- صفحه اکانت -->
        <div id="screen-account" class="screen">
            <h1>👤 تنظیمات اکانت</h1>
            <div class="account-box">
                <div class="profile-card" id="profile-display"></div>
                <label>نام و نام خانوادگی:</label>
                <input type="text" id="user-name-input" placeholder="مثلا: اقا رضا">
                
                <label>پایه تحصیلی:</label>
                <select id="user-class-select">
                    <option value="شیشم ۱">شیشم ۱</option>
                    <option value="نهم ۲">شیشم ۲</option>
                    <option value="شیشم ۱">شیشم ۱</option>
                </select>

                <button class="btn" style="width: 100%; margin-top: 5px; font-size: 1.1rem; padding: 10px;" onclick="playSound(); saveAccountInfo()">ذخیره اطلاعات ✅</button>
            </div>
            <button class="back-icon-btn" onclick="playSound(); goToScreen('screen-home')">⬅</button>
        </div>

        <!-- صفحه تنظیمات -->
        <div id="screen-settings" class="screen">
            <h1>⚙️ تنظیمات</h1>
            <div class="settings-box">
                <div class="setting-item">
                    <span>پخش صدا 🔊</span>
                    <label class="switch">
                        <input type="checkbox" id="sound-toggle" checked onchange="toggleSound()">
                        <span class="slider"></span>
                    </label>
                </div>
                <hr style="border: 0; border-top: 1px solid #eee;">
                <div>
                    <button class="danger-action-btn" onclick="playSound(); resetProgress()">از دست دادن پیشرفت‌ها ⚠️</button>
                </div>
                <div>
                    <button class="danger-action-btn" onclick="playSound(); resetAccount()">از دست دادن اکانت ⚠️</button>
                </div>
            </div>
            <button class="back-icon-btn" onclick="playSound(); goToScreen('screen-home')">⬅</button>
        </div>

        <!-- صفحه انتخاب بخش -->
        <div id="screen-subjects" class="screen">
            <h1>📚 انتخاب بخش بازی</h1>
            <div class="subjects-grid">
                <button class="subject-btn" onclick="playSound(); openStages('کلمات به‌هم‌ریخته')">🎯 ورود به مراحل کلمات</button>
            </div>
            <button class="back-icon-btn" onclick="playSound(); goToScreen('screen-home')">⬅</button>
        </div>

        <!-- صفحه مراحل -->
        <div id="screen-stages" class="screen">
            <h1 id="stages-title-text" style="font-size: 1.5rem; margin-bottom: 15px;">مراحل بازی</h1>
            <div class="stages-container">
                <div class="stages-grid" id="stages-grid-box"></div>
                <div class="pagination-box">
                    <button class="page-nav-btn" id="next-page-btn" onclick="playSound(); changeStagePage(1)">بعدی ⬅</button>
                    <span id="page-indicator" class="page-indicator">صفحه ۱ از ۳۴</span>
                    <button class="page-nav-btn" id="prev-page-btn" onclick="playSound(); changeStagePage(-1)">➡ قبلی</button>
                </div>
            </div>
            <button class="back-icon-btn" onclick="playSound(); goToScreen('screen-subjects')">⬅</button>
        </div>

        <!-- صفحه حل کلمه -->
        <div id="screen-quiz" class="screen">
            <h1 id="quiz-title" style="font-size: 1.1rem; margin-bottom: 10px;">مرحله</h1>
            <div class="quiz-box">
                <h3>حروف به‌هم‌ریخته زیر را مرتب کنید:</h3>
                <div id="scrambled-display" class="scrambled-word"></div>
                <input type="text" id="user-word-input" placeholder="کلمه درست را اینجا بنویسید..." autocomplete="off">
                <button class="submit-word-btn" onclick="playSound(); checkWordAnswer()">بررسی پاسخ ✅</button>
            </div>
            <button class="back-icon-btn" onclick="playSound(); goToScreen('screen-stages')">⬅</button>
        </div>

    </div>

    <script>
        let soundEnabled = true;
        function toggleSound() { soundEnabled = document.getElementById('sound-toggle').checked; }

        function playSound() {
            if (!soundEnabled) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function goToScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        let userName = localStorage.getItem('user_name') || 'علی';
        let userClass = localStorage.getItem('user_class') || 'شیشم ۱';

        function updateAccountUI() {
            document.getElementById('user-name-input').value = userName;
            document.getElementById('user-class-select').value = userClass;
            document.getElementById('profile-display').innerHTML = `<b>${userName}</b><br><span style="color: #1976d2;">پایه ${userClass}</span>`;
            document.getElementById('welcome-msg').innerText = `سلام، ${userName} 👋`;
        }

        function saveAccountInfo() {
            userName = document.getElementById('user-name-input').value.trim() || 'علی';
            userClass = document.getElementById('user-class-select').value;
            localStorage.setItem('user_name', userName);
            localStorage.setItem('user_class', userClass);
            updateAccountUI();
            alert('اطلاعات اکانت ذخیره شد! ✅');
            goToScreen('screen-home');
        }
        updateAccountUI();

        let currentStagePage = 1;
        const stagesPerPage = 6;
        
        // لیست کامل ۲۰۰ کلمه‌ای که فرستادی
        const rawWords = [
            "فنجان", "پنیر", "مداد", "موز", "صندلی", "کتاب", "طناب", "قاشق", "ابریشم", "سبد", 
            "جغد", "انگور", "شالگردن", "گیتار", "چتر", "پیاز", "تمبر", "شکلات", "صخره", "نمک", 
            "پازل", "انار", "فرمان", "برنج", "لیوان", "هلو", "نخ", "گردو", "تلسکوپ", "پارچ", 
            "پاکت", "زعفران", "کیف", "جعبه", "عینک", "فلفل", "دکمه", "جو", "مگنت", "کره", 
            "قایق", "درخت", "ستاره", "توفان", "زنجیر", "پتو", "پاک‌کن", "چراغ", "سیمان", "پیانو", 
            "فنجان", "طبل", "نردبان", "میکروفون", "نقاشی", "مجله", "بشقاب", "مربا", "ساعت", "خیار", 
            "رادیو", "سیر", "پور", "دارچین", "فیلتر", "لیمو", "قفل", "پرتقال", "چرخ‌دنده", "هندوانه", 
            "بطری", "شلیل", "سوزن", "توت‌فرنگی", "دوربین", "فندق", "قطب‌نما", "کیوی", "پوشه", "خرما", 
            "چسب", "گندم", "اسکناس", "لوبیا", "کفش", "لپه", "گردنبند", "سالاد", "زیپ", "قوری", 
            "بادبادک", "اقیانوس", "مقوا", "آجر", "جغرافیا", "فرش", "باطری", "پرده", "کالسکه", "شیپور", 
            "کویر", "روزنامه", "آکواریوم", "بیسکویت", "خورشید", "عسل", "بالشت", "گوجه", "بادام", "زردچوبه", 
            "پرچم", "زنجبیل", "گیره", "انبه", "آفتابه", "خربزه", "بشکه", "گیلاس", "قیچی", "آلبالو", 
            "شمع", "بادام‌زمینی", "تلویزیون", "نارگیل", "میکروسکوپ", "انجیر", "نقشه", "کشمش", "دفترچه", "عدس", 
            "منگنه", "نخود", "کارت", "ماش", "چمدان", "رشته", "کلاه", "سوپ", "ساعت", "پیش‌دستی", 
            "دستبند", "دیس", "گوشواره", "چنگال", "کمربند", "ملاقه", "روبان", "سینی", "تور", "قندان", 
            "صدف", "استکان", "بادبزن", "کیسه", "قاب", "کارتن", "باغچه", "صندوقچه", "آبپاش", "رمز", 
            "فرغون", "بانک", "چکش", "ترازو", "پنجره", "آمپلی‌فایر", "جاکلیدی", "تقویم", "صابون", "سیب‌زمینی", 
            "یخچال", "آبنبات", "صخره", "کمانچه", "خودکار", "گونی", "گاوصندوق", "کارت‌بانکی", "دستگاه‌کارت‌خوان", "خودپرداز", 
            "اسکناس‌شمار", "کلید", "صندوق", "سبد", "کفگیر", "کارد", "کاسه", "ماکارونی", "انار", "آناناس", 
            "فندق", "توت‌فرنگی", "آلبالو", "هلو", "سیر", "فلفل", "پنیر", "شکلات", "کتاب", "صندلی"
        ];

        const totalStages = rawWords.length; // ۲۰۰ مرحله
        const totalPages = Math.ceil(totalStages / stagesPerPage);

        // تابع برای به‌هم ریختن حروف یک کلمه
        function scrambleWord(word) {
            let arr = word.split('');
            let scrambled;
            do {
                for (let i = arr.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                scrambled = arr.join(' ');
            } while (scrambled === word && word.length > 1);
            return scrambled;
        }

        let unlockedStage = localStorage.getItem('wordgame_unlockedStage') ? parseInt(localStorage.getItem('wordgame_unlockedStage')) : 1;
        let stageStars = localStorage.getItem('wordgame_stageStars') ? JSON.parse(localStorage.getItem('wordgame_stageStars')) : {};

        let activeStageNum = 1;

        function resetProgress() {
            if (confirm("آیا مطمئنید می‌خواهید پیشرفت‌ها را پاک کنید؟")) {
                localStorage.removeItem('wordgame_unlockedStage');
                localStorage.removeItem('wordgame_stageStars');
                unlockedStage = 1;
                stageStars = {};
                renderStages();
                alert("پیشرفت‌ها ریست شد! 🔄");
            }
        }

        function resetAccount() {
            if (confirm("آیا اکانت ریست شود؟")) {
                localStorage.removeItem('user_name');
                localStorage.removeItem('user_class');
                userName = 'علی';
                userClass = 'نهم ۱';
                updateAccountUI();
                alert("اکانت ریست شد!");
            }
        }

        function openStages(subjectName) {
            currentStagePage = 1;
            document.getElementById('stages-title-text').innerText = 'مراحل ' + subjectName;
            renderStages();
            goToScreen('screen-stages');
        }

        function renderStages() {
            const gridBox = document.getElementById('stages-grid-box');
            gridBox.innerHTML = '';
            
            const startIndex = (currentStagePage - 1) * stagesPerPage;
            let pageStages = [];
            for (let i = 0; i < stagesPerPage; i++) {
                let sNum = startIndex + i + 1;
                if (sNum <= totalStages) {
                    pageStages.push(sNum);
                }
            }

            pageStages.forEach(i => {
                let isLocked = i > unlockedStage;
                if (isLocked) {
                    gridBox.innerHTML += `
                        <div class="stage-card locked" onclick="playSound(); alert('🔒 این مرحله هنوز قفل است!')">
                            مرحله ${i}
                            <div class="stars">🔒 قفل</div>
                        </div>`;
                } else {
                    let starsCount = stageStars[i] !== undefined ? stageStars[i] : 3;
                    let starsStr = '⭐'.repeat(starsCount);
                    gridBox.innerHTML += `
                        <div class="stage-card" onclick="playSound(); startQuiz(${i})">
                            مرحله ${i}
                            <div class="stars">${starsStr}</div>
                        </div>`;
                }
            });

            document.getElementById('page-indicator').innerText = `صفحه ${currentStagePage} از ${totalPages}`;
            document.getElementById('prev-page-btn').disabled = (currentStagePage === 1);
            document.getElementById('next-page-btn').disabled = (currentStagePage === totalPages);
        }

        function changeStagePage(direction) {
            currentStagePage += direction;
            if (currentStagePage < 1) currentStagePage = 1;
            if (currentStagePage > totalPages) currentStagePage = totalPages;
            renderStages();
        }

        function startQuiz(stageNum) {
            activeStageNum = stageNum;
            let correctWord = rawWords[stageNum - 1];
            let scrambled = scrambleWord(correctWord);

            document.getElementById('quiz-title').innerText = `مرحله ${stageNum}`;
            document.getElementById('scrambled-display').innerText = scrambled;
            document.getElementById('user-word-input').value = '';
            
            goToScreen('screen-quiz');
        }

        function checkWordAnswer() {
            let userGuess = document.getElementById('user-word-input').value.trim();
            let correctWord = rawWords[activeStageNum - 1];

            if (userGuess === correctWord) {
                // پاسخ درست: ۳ ستاره
                alert('آفرین! پاسخ درست بود! 🎉 (۳ ستاره گرفتی)');
                stageStars[activeStageNum] = 3;
            } else {
                // پاسخ اشتباه: قانون ۱ ستاره و رفتن به مرحله بعد
                alert(`پاسخ اشتباه بود! ❌ کلمه درست «${correctWord}» بود. (اما عبور کردی و ۱ ستاره گرفتی)`);
                stageStars[activeStageNum] = 1;
            }

            if (activeStageNum >= unlockedStage) {
                unlockedStage = activeStageNum + 1;
            }
            localStorage.setItem('wordgame_unlockedStage', unlockedStage);
            localStorage.setItem('wordgame_stageStars', JSON.stringify(stageStars));
            goToScreen('screen-stages');
            renderStages();
        }

        function exitGame() {
            window.close();
            alert("می‌توانید این تب را ببندید.");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی مرتب کردن کلمات</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-frame {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background: radial-gradient(circle, #ffeb3b, #fbc02d);
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 8px solid #333;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: radial-gradient(circle, #ffeb3b, #fbc02d);
            animation: fadeIn 0.4s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #d32f2f;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 5px rgba(255,255,255,0.8);
        }

        .btn {
            background: linear-gradient(45deg, #f12711, #f5af19);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            margin: 6px;
            width: 80%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.3);
        }

        .account-btn { background: linear-gradient(45deg, #8e2de2, #4a00e0); }
        .settings-btn { background: linear-gradient(45deg, #00c6ff, #0072ff); }
        .exit-btn { background: linear-gradient(45deg, #cb2d3e, #ef473a); }

        /* استایل باکس من ربات نیستم */
        .captcha-box {
            background: white;
            border: 2px solid #d3d3d3;
            border-radius: 10px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 85%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .captcha-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .captcha-left input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .captcha-left span {
            font-size: 0.95rem;
            font-weight: bold;
            color: #333;
        }

        .captcha-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.65rem;
            color: #555;
        }

        .captcha-logo div {
            width: 24px;
            height: 24px;
            background: #4285F4;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .account-box, .settings-box, .quiz-box {
            background: white;
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            color: #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: right;
        }

        .account-box label {
            font-size: 0.95rem;
            font-weight: bold;
            color: #d32f2f;
        }

        .account-box input, .account-box select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Vazirmatn', sans-serif;
            outline: none;
        }

        .profile-card {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #2196F3;
            text-align: center;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 1rem;
            font-weight: bold;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-item input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .danger-action-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 34px;
        }
        .slider-toggle:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider-toggle { background-color: #2196F3; }
        input:checked + .slider-toggle:before { transform: translateX(24px); }

        .subjects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }

        .subject-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #ff9800;
            color: #d32f2f;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .subject-btn:hover { background: white; transform: scale(1.05); }

        .stages-container { width: 100%; margin-bottom: 10px; }
        
        .stages-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 350px;
            margin: 0 auto 15px auto;
            direction: rtl;
        }

        .stage-card {
            background: #4caf50;
            border: 3px solid #fff;
            border-radius: 18px;
            padding: 15px 5px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        .stage-card:hover { transform: scale(1.03); }
        
        .stage-card.locked {
            background: #9e9e9e;
            border: 3px dashed #e0e0e0;
            cursor: not-allowed;
        }
        
        .stars {
            font-size: 0.75rem;
            color: #ffeb3b;
            margin-top: 4px;
            min-height: 15px;
            letter-spacing: 1px;
        }

        .pagination-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
            padding: 0 5px;
        }

        .page-nav-btn {
            background: #ffa726; 
            color: white; 
            border: none; 
            padding: 10px 22px;
            border-radius: 30px; 
            font-weight: bold; 
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .page-nav-btn:disabled { background: #bdbdbd; cursor: not-allowed; box-shadow: none; }
        
        .page-indicator {
            font-weight: 900;
            color: #3b2c00;
            font-size: 1.1rem;
        }

        .back-icon-btn {
            position: absolute; bottom: 20px; left: 20px; background: #f44336;
            color: white; border: none; width: 45px; height: 45px; border-radius: 50%;
            font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .quiz-box h3 { margin-bottom: 12px; color: #388e3c; font-size: 1rem; line-height: 1.5; }
        
        .scrambled-word {
            font-size: 1.8rem;
            font-weight: 900;
            color: #d32f2f;
            background: #ffe082;
            padding: 10px;
            border-radius: 12px;
            letter-spacing: 4px;
            margin-bottom: 15px;
            border: 2px dashed #f57c00;
        }

        .quiz-box input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #4caf50;
            border-radius: 12px;
            font-size: 1.2rem;
            font-family: 'Vazirmatn', sans-serif;
            text-align: center;
            outline: none;
            margin-bottom: 10px;
        }

        .submit-word-btn {
            background: linear-gradient(45deg, #4caf50, #8bc34a);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .submit-word-btn:hover { background: linear-gradient(45deg, #388e3c, #7cb342); }
    </style>
</head>
<body>

    <!-- موزیک پس‌زمینه با قابلیت تکرار خودکار -->
    <audio id="bg-music" src="kki2.mp3" loop></audio>

    <div class="phone-frame">
        
        <!-- صفحه بررسی ربات (اولین صفحه ورود) -->
        <div id="screen-captcha" class="screen active">
            <h1 style="font-size: 1.5rem; margin-bottom: 10px;">🔒 تایید ورود</h1>
            <p style="color: #444; margin-bottom: 20px; font-size: 0.95rem;">برای ورود به بازی، لطفا تایید کنید:</p>
            
            <div class="captcha-box">
                <div class="captcha-left">
                    <input type="checkbox" id="robot-checkbox" onchange="verifyRobot(this)">
                    <span>من ربات نیستم</span>
                </div>
                <div class="captcha-logo">
                    <div>🤖</div>
                    <span>reCAPTCHA</span>
                </div>
            </div>
        </div>

        <!-- صفحه اول -->
        <div id="screen-home" class="screen">
            <h1>🧩 کلمات به‌هم‌ریخته</h1>
            <div id="welcome-msg" style="font-weight: bold; color: #333; margin-bottom: 10px; font-size: 1.1rem;"></div>
            <button class="btn" onclick="goToScreen('screen-subjects')">شروع بازی 🔔</button>
            <button class="btn account-btn" onclick="goToScreen('screen-account')">اکانت 👤</button>
            <button class="btn settings-btn" onclick="goToScreen('screen-settings')">تنظیمات ⚙️</button>
            <button class="btn exit-btn" onclick="exitGame()">خروج 🚪</button>
        </div>

        <!-- صفحه اکانت -->
        <div id="screen-account" class="screen">
            <h1>👤 تنظیمات اکانت</h1>
            <div class="account-box">
                <div class="profile-card" id="profile-display"></div>
                <label>نام و نام خانوادگی:</label>
                <input type="text" id="user-name-input" placeholder="مثلا: علی">
                
                <label>پایه تحصیلی:</label>
                <select id="user-class-select">
                    <option value="نهم ۱">نهم ۱</option>
                    <option value="نهم ۲">نهم ۲</option>
                    <option value="ششم ۱">ششم ۱</option>
                </select>

                <button class="btn" style="width: 100%; margin-top: 5px; font-size: 1.1rem; padding: 10px;" onclick="saveAccountInfo()">ذخیره اطلاعات ✅</button>
            </div>
            <button class="back-icon-btn" onclick="goToScreen('screen-home')">⬅</button>
        </div>

        <!-- صفحه تنظیمات -->
        <div id="screen-settings" class="screen">
            <h1>⚙️ تنظیمات</h1>
            <div class="settings-box">
                <div class="setting-row">
                    <span>پخش موزیک 🔊</span>
                    <label class="switch">
                        <input type="checkbox" id="sound-toggle" checked onchange="toggleSound()">
                        <span class="slider-toggle"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <span>تنظیم بلندی صدا (ولوم) 🎚️</span>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume()">
                </div>
                <hr style="border: 0; border-top: 1px solid #eee;">
                <div>
                    <button class="danger-action-btn" onclick="resetProgress()">از دست دادن پیشرفت‌ها ⚠️</button>
                </div>
                <div>
                    <button class="danger-action-btn" onclick="resetAccount()">از دست دادن اکانت ⚠️</button>
                </div>
            </div>
            <button class="back-icon-btn" onclick="goToScreen('screen-home')">⬅</button>
        </div>

        <!-- صفحه انتخاب بخش -->
        <div id="screen-subjects" class="screen">
            <h1>📚 انتخاب بخش بازی</h1>
            <div class="subjects-grid">
                <button class="subject-btn" onclick="openStages('کلمات به‌هم‌ریخته')">🎯 ورود به مراحل کلمات</button>
            </div>
            <button class="back-icon-btn" onclick="goToScreen('screen-home')">⬅</button>
        </div>

        <!-- صفحه مراحل -->
        <div id="screen-stages" class="screen">
            <h1 id="stages-title-text" style="font-size: 1.5rem; margin-bottom: 15px;">مراحل بازی</h1>
            <div class="stages-container">
                <div class="stages-grid" id="stages-grid-box"></div>
                <div class="pagination-box">
                    <button class="page-nav-btn" id="next-page-btn" onclick="changeStagePage(1)">بعدی ⬅</button>
                    <span id="page-indicator" class="page-indicator">صفحه ۱</span>
                    <button class="page-nav-btn" id="prev-page-btn" onclick="changeStagePage(-1)">➡ قبلی</button>
                </div>
            </div>
            <button class="back-icon-btn" onclick="goToScreen('screen-subjects')">⬅</button>
        </div>

        <!-- صفحه حل کلمه -->
        <div id="screen-quiz" class="screen">
            <h1 id="quiz-title" style="font-size: 1.1rem; margin-bottom: 10px;">مرحله</h1>
            <div class="quiz-box">
                <h3>حروف به‌هم‌ریخته زیر را مرتب کنید:</h3>
                <div id="scrambled-display" class="scrambled-word"></div>
                <input type="text" id="user-word-input" placeholder="کلمه درست را اینجا بنویسید..." autocomplete="off">
                <button class="submit-word-btn" onclick="checkWordAnswer()">بررسی پاسخ ✅</button>
            </div>
            <button class="back-icon-btn" onclick="goToScreen('screen-stages')">⬅</button>
        </div>

    </div>

    <script>
        const bgMusic = document.getElementById('bg-music');
        
        // بارگذاری تنظیمات صدا از localStorage (پیش‌فرض ولوم روی ۱ یعنی حداکثر)
        let soundEnabled = localStorage.getItem('wordgame_soundEnabled') !== null ? JSON.parse(localStorage.getItem('wordgame_soundEnabled')) : true;
        let soundVolume = localStorage.getItem('wordgame_soundVolume') ? parseFloat(localStorage.getItem('wordgame_soundVolume')) : 1;
        
        bgMusic.volume = soundVolume;

        // تنظیم مقادیر دکمه‌ها و اسلایدرها هنگام لود صفحه
        window.addEventListener('DOMContentLoaded', () => {
            const soundToggleElem = document.getElementById('sound-toggle');
            const volumeSliderElem = document.getElementById('volume-slider');
            if (soundToggleElem) soundToggleElem.checked = soundEnabled;
            if (volumeSliderElem) volumeSliderElem.value = soundVolume;
        });

        // تکرار آهنگ به محض به اتمام رسیدن
        bgMusic.addEventListener('ended', () => {
            if (soundEnabled) {
                bgMusic.currentTime = 0;
                bgMusic.play().catch(e => {});
            }
        });

        // تابع تایید «من ربات نیستم» و شروع پخش آهنگ
        function verifyRobot(checkbox) {
            if (checkbox.checked) {
                if (soundEnabled) {
                    bgMusic.play().catch(e => {});
                }
                setTimeout(() => {
                    goToScreen('screen-home');
                }, 400);
            }
        }

        function toggleSound() { 
            soundEnabled = document.getElementById('sound-toggle').checked;
            localStorage.setItem('wordgame_soundEnabled', soundEnabled);
            
            if (soundEnabled) {
                bgMusic.play().catch(e => {});
            } else {
                bgMusic.pause();
            }
        }

        function changeVolume() {
            const vol = document.getElementById('volume-slider').value;
            bgMusic.volume = vol;
            localStorage.setItem('wordgame_soundVolume', vol);
        }

        function goToScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            if (soundEnabled && bgMusic.paused && screenId !== 'screen-captcha') {
                bgMusic.play().catch(e => {});
            }
        }

        let userName = localStorage.getItem('user_name') || 'علی';
        let userClass = localStorage.getItem('user_class') || 'نهم ۱';

        function updateAccountUI() {
            document.getElementById('user-name-input').value = userName;
            document.getElementById('user-class-select').value = userClass;
            document.getElementById('profile-display').innerHTML = `<b>${userName}</b><br><span style="color: #1976d2;">پایه ${userClass}</span>`;
            document.getElementById('welcome-msg').innerText = `سلام، ${userName} 👋`;
        }

        function saveAccountInfo() {
            userName = document.getElementById('user-name-input').value.trim() || 'علی';
            userClass = document.getElementById('user-class-select').value;
            localStorage.setItem('user_name', userName);
            localStorage.setItem('user_class', userClass);
            updateAccountUI();
            alert('اطلاعات اکانت ذخیره شد! ✅');
            goToScreen('screen-home');
        }
        updateAccountUI();

        let currentStagePage = localStorage.getItem('wordgame_currentStagePage') ? parseInt(localStorage.getItem('wordgame_currentStagePage')) : 1;
        const stagesPerPage = 6;
        
        const rawWords = [
            "فنجان", "پنیر", "مداد", "موز", "صندلی", "کتاب", "طناب", "قاشق", "ابریشم", "سبد",

        const totalStages = rawWords.length;
        const totalPages = Math.ceil(totalStages / stagesPerPage);

        function scrambleWord(word) {
            let arr = word.split('');
            let scrambled;
            do {
                for (let i = arr.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                scrambled = arr.join(' ');
            } while (scrambled === word && word.length > 1);
            return scrambled;
        }

        let unlockedStage = localStorage.getItem('wordgame_unlockedStage') ? parseInt(localStorage.getItem('wordgame_unlockedStage')) : 1;
        let stageStars = localStorage.getItem('wordgame_stageStars') ? JSON.parse(localStorage.getItem('wordgame_stageStars')) : {};

        let activeStageNum = 1;

        function resetProgress() {
            if (confirm("آیا مطمئنید می‌خواهید پیشرفت‌ها را پاک کنید؟")) {
                localStorage.removeItem('wordgame_unlockedStage');
                localStorage.removeItem('wordgame_stageStars');
                localStorage.removeItem('wordgame_currentStagePage');
                unlockedStage = 1;
                currentStagePage = 1;
                stageStars = {};
                renderStages();
                alert("پیشرفت‌ها ریست شد! 🔄");
            }
        }

        function resetAccount() {
            if (confirm("آیا اکانت ریست شود؟")) {
                localStorage.removeItem('user_name');
                localStorage.removeItem('user_class');
                userName = 'علی';
                userClass = 'نهم ۱';
                updateAccountUI();
                alert("اکانت ریست شد!");
            }
        }

        function openStages(subjectName) {
            currentStagePage = localStorage.getItem('wordgame_currentStagePage') ? parseInt(localStorage.getItem('wordgame_currentStagePage')) : 1;
            document.getElementById('stages-title-text').innerText = 'مراحل ' + subjectName;
            renderStages();
            goToScreen('screen-stages');
        }

        function renderStages() {
            const gridBox = document.getElementById('stages-grid-box');
            gridBox.innerHTML = '';
            
            const startIndex = (currentStagePage - 1) * stagesPerPage;
            let pageStages = [];
            for (let i = 0; i < stagesPerPage; i++) {
                let sNum = startIndex + i + 1;
                if (sNum <= totalStages) {
                    pageStages.push(sNum);
                }
            }

            pageStages.forEach(i => {
                let iLocked = i > unlockedStage;
                if (iLocked) {
                    gridBox.innerHTML += `
                        <div class="stage-card locked" onclick="alert('🔒 این مرحله هنوز قفل است!')">
                            مرحله ${i}
                            <div class="stars">🔒 قفل</div>
                        </div>`;
                } else {
                    let starsStr = '';
                    if (stageStars[i] !== undefined) {
                        starsStr = '⭐'.repeat(stageStars[i]);
                    }
                    
                    gridBox.innerHTML += `
                        <div class="stage-card" onclick="startQuiz(${i})">
                            مرحله ${i}
                            <div class="stars">${starsStr}</div>
                        </div>`;
                }
            });

            document.getElementById('page-indicator').innerText = `صفحه ${currentStagePage} از ${totalPages}`;
            document.getElementById('prev-page-btn').disabled = (currentStagePage === 1);
            document.getElementById('next-page-btn').disabled = (currentStagePage === totalPages);
        }

        function changeStagePage(direction) {
            currentStagePage += direction;
            if (currentStagePage < 1) currentStagePage = 1;
            if (currentStagePage > totalPages) currentStagePage = totalPages;
            
            localStorage.setItem('wordgame_currentStagePage', currentStagePage);
            
            renderStages();
        }

        function startQuiz(stageNum) {
            activeStageNum = stageNum;
            let correctWord = rawWords[stageNum - 1];
            let scrambled = scrambleWord(correctWord);

            document.getElementById('quiz-title').innerText = `مرحله ${stageNum}`;
            document.getElementById('scrambled-display').innerText = scrambled;
            document.getElementById('user-word-input').value = '';
            
            goToScreen('screen-quiz');
        }

        function checkWordAnswer() {
            let userGuess = document.getElementById('user-word-input').value.trim();
            let correctWord = rawWords[activeStageNum - 1];

            if (userGuess === correctWord) {
                alert('آفرین! پاسخ درست بود! 🎉');
                stageStars[activeStageNum] = 3;

                if (activeStageNum >= unlockedStage) {
                    unlockedStage = activeStageNum + 1;
                }
                localStorage.setItem('wordgame_unlockedStage', unlockedStage);
                localStorage.setItem('wordgame_stageStars', JSON.stringify(stageStars));
                goToScreen('screen-stages');
                renderStages();
            } else {
                alert('اشتباه زدی! ❌ کلمه رو درست وارد کن تا بتونی بری مرحله بعد.');
            }
        }

        function exitGame() {
            window.close();
            alert("می‌توانید این تب را ببندید.");
        }
